<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#14243a">
    <meta name="description" content="Calculadora simples para realizar operações matemáticas básicas.">
    <title>Calculadora | Operações básicas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="calculadora" aria-labelledby="titulo-calculadora">
        <header class="cabecalho">
            <div class="icone-matematica" aria-hidden="true">±</div>
            <p class="sobretitulo">FERRAMENTA DE CÁLCULO</p>
            <h1 id="titulo-calculadora">Calculadora</h1>
            <p class="descricao">Faça suas operações de forma rápida e simples.</p>
        </header>

        <section class="formulario" aria-label="Dados para o cálculo">
            <div class="campo">
                <label for="numero1">Primeiro número</label>
                <input type="number" id="numero1" step="any" inputmode="decimal" placeholder="Ex.: 125" autocomplete="off">
            </div>

            <div class="campo">
                <label for="numero2">Segundo número</label>
                <input type="number" id="numero2" step="any" inputmode="decimal" placeholder="Ex.: 25" autocomplete="off">
            </div>

            <div class="rotulo-operacoes">Escolha uma operação</div>
            <div class="botoes" aria-label="Operações matemáticas">
                <button type="button" class="botao-operacao" onclick="somar()" aria-label="Somar os números">
                    <span class="simbolo" aria-hidden="true">+</span>
                    <span>Somar</span>
                </button>
                <button type="button" class="botao-operacao" onclick="subtrair()" aria-label="Subtrair os números">
                    <span class="simbolo" aria-hidden="true">−</span>
                    <span>Subtrair</span>
                </button>
                <button type="button" class="botao-operacao" onclick="multiplicar()" aria-label="Multiplicar os números">
                    <span class="simbolo" aria-hidden="true">×</span>
                    <span>Multiplicar</span>
                </button>
                <button type="button" class="botao-operacao" onclick="dividir()" aria-label="Dividir os números">
                    <span class="simbolo" aria-hidden="true">÷</span>
                    <span>Dividir</span>
                </button>
            </div>
        </section>

        <section class="painel-resultado" aria-live="polite" aria-atomic="true">
            <div class="resultado-cabecalho">
                <span class="indicador" aria-hidden="true"></span>
                <span>RESULTADO</span>
            </div>
            <p id="resultado">Aguardando cálculo</p>
        </section>

        <footer class="rodape">Calculadora de operações básicas</footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
